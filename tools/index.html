<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Tools</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --navy:#0b2545; --navy2:#13315c; --gold:#c8963e; --gold-soft:#f3d9a4;
    --bg:#f3f5f9; --surface:#ffffff; --surface2:#f8fafc; --line:#dbe1ea; --line2:#e8ecf2;
    --text:#0f172a; --muted:#566275; --faint:#8a94a6; --focus:#2563eb;
    --shadow:0 1px 2px rgba(15,23,42,.06); --shadow-h:0 10px 28px rgba(15,23,42,.12); --r:14px;
    --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0a1220;--surface:#101a2e;--surface2:#0d1627;--line:#233250;--line2:#1b2842;--text:#e6ebf4;--muted:#9aa7bd;--faint:#6f7c93;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-h:0 12px 30px rgba(0,0,0,.5)}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
  .band{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--gold)}
  .band-in{max-width:1200px;margin:0 auto;padding:22px 24px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .id{display:flex;align-items:center;gap:16px;min-width:0}
  .mark{flex:none;width:54px;height:54px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;font-weight:800;letter-spacing:1px;font-size:16px;color:var(--gold-soft)}
  .org{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  h1{margin:2px 0;font-size:25px;line-height:1.15;font-weight:700}
  .sub{margin:0;color:#c5d1e4;font-size:13px}
  .clock{text-align:right;color:#c5d1e4;font-size:12px;white-space:nowrap}
  .clock b{display:block;color:#fff;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px 56px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:-20px 0 0}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .stat b{font-size:22px;font-weight:700;line-height:1.1}
  .stat span{color:var(--muted);font-size:12px}
  .stat.new{border-color:var(--gold)}
  .toolbar{position:sticky;top:0;z-index:20;margin:16px -8px 0;padding:10px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
  .toolbar-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
  .search{flex:1 1 260px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:9px;background:var(--surface2);border:1px solid var(--line2);color:var(--faint);min-height:40px}
  .search:focus-within{border-color:var(--focus)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:8px 0}
  .search kbd{font:600 11px var(--font);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--faint)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12.5px var(--font);padding:7px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
  .chip:hover{border-color:var(--navy2);color:var(--text)}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip i{font-style:normal;font-size:11px;opacity:.75}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .sec{margin-top:30px}.sec[hidden]{display:none}
  .sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .sec-h h2{margin:0;font-size:16px;display:flex;gap:10px;align-items:center}
  .sec-h .bar{width:4px;height:18px;border-radius:2px}
  .sec-h p{margin:0;color:var(--muted);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
  a.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--c)}
  .card[hidden]{display:none}
  .card-top{display:flex;gap:12px;align-items:flex-start}
  .tile{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line))}
  .card h3{margin:0;font-size:15px;line-height:1.25}
  .meta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:1px 7px}
  .badge-new{font-size:10.5px;font-weight:700;background:var(--gold);color:#1b1100;border-radius:5px;padding:1px 7px}
  .badge-soon{font-size:10.5px;font-weight:700;background:var(--line2);color:var(--muted);border-radius:5px;padding:1px 7px}
  .card p{margin:0;color:var(--muted);font-size:13px}
  .use{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line2)}
  .use b{color:var(--muted);font-weight:600}
  .open{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px;color:var(--c)}
  .card.soon{opacity:.72;cursor:not-allowed}.card.soon .open{color:var(--faint)}
  .card.feature{grid-column:1/-1;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 7%,var(--surface)),var(--surface) 60%);padding:18px 20px}
  .card.feature h3{font-size:17px}
  .empty{display:none;margin-top:26px;text-align:center;padding:36px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);background:var(--surface)}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  @media (max-width:640px){
    .band-in{padding:18px 16px 30px}h1{font-size:19px}.mark{width:44px;height:44px}.clock{display:none}
    .wrap{padding:0 14px 44px}.stats{gap:8px}.stat{padding:10px 12px}
    .toolbar{position:static;margin:14px 0 0;padding:0;background:none}
    .chips{flex-wrap:nowrap;overflow-x:auto;width:100%}.grid{grid-template-columns:1fr}.search kbd{display:none}
  }
  @media print{.toolbar{display:none}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="id">
    <div><div class="org">Personal toolkit</div>
      <h1>Field Operations Hub</h1>
      <p class="sub">PLFS · Urban Frame Survey · Office &amp; Bills · GIS tools</p></div></div>
  <div class="clock" aria-hidden="true"><b id="nowTime">--:--</b><span id="nowDate">&nbsp;</span></div>
</div></header>
<main class="wrap">
  <section class="stats" id="stats" aria-label="Overview"></section>
  <div class="toolbar"><div class="toolbar-in">
    <label class="search"><span id="sIcon" aria-hidden="true"></span>
      <input id="q" type="search" placeholder="Search tools — e.g. GPS, bill, weekly, KML" autocomplete="off" aria-label="Search tools"><kbd>/</kbd></label>
    <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
  </div></div>
  <div class="empty" id="empty">No tools match that search. Try a different word or clear the filter.</div>
  <div id="sections"></div>
  <footer><div><b>Field Operations Hub</b> · 2026</div>
    <div>Tools run in your browser; some sync through Firebase. Press <b>/</b> to search.</div></footer>
</main>
<script src="assets/tools.js"></script>
<script>
(function(){
  var CATS=window.NSO_CATEGORIES,TOOLS=window.NSO_TOOLS,icon=window.NSO_icon;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var state={q:'',cat:'all'};
  var live=TOOLS.filter(function(t){return t.status!=='soon'}).length,nw=TOOLS.filter(function(t){return t.isNew}).length;
  $('#stats').innerHTML='<div class="stat"><b>'+live+'</b><span>Tools available</span></div><div class="stat"><b>'+CATS.length+'</b><span>Work areas</span></div><div class="stat new"><b>'+nw+'</b><span>Newly added</span></div>';
  $('#sIcon').innerHTML=icon('search',18);
  var ch='<button class="chip" data-cat="all" aria-pressed="true">All <i>'+TOOLS.length+'</i></button>';
  CATS.forEach(function(c){var n=TOOLS.filter(function(t){return t.cat===c.id}).length;
    ch+='<button class="chip" data-cat="'+c.id+'" aria-pressed="false"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+' <i>'+n+'</i></button>'});
  $('#chips').innerHTML=ch;
  function card(t,c){
    var soon=t.status==='soon';
    var inner='<div class="card-top"><div class="tile">'+icon(t.icon,t.featured?24:20)+'</div><div style="min-width:0"><h3>'+esc(t.title)+'</h3><div class="meta"><span class="tag">'+esc(t.type)+'</span>'+(t.isNew?'<span class="badge-new">NEW</span>':'')+(soon?'<span class="badge-soon">NOT IN THIS PACKAGE</span>':'')+'</div></div></div>'+
      '<p>'+esc(t.desc)+'</p><div class="use"><b>Use when:</b> '+esc(t.use)+'</div><div class="open"><span>'+(soon?'Add '+esc(t.file)+' to enable':'Open')+'</span>'+(soon?'':icon('arrow',18))+'</div>';
    var a=' data-cat="'+t.cat+'" data-text="'+esc((t.title+' '+t.type+' '+t.desc+' '+t.keys).toLowerCase())+'" style="--c:'+c.color+'"';
    if(soon)return'<div class="card soon"'+a+' aria-disabled="true">'+inner+'</div>';
    return'<a class="card'+(t.featured?' feature':'')+'" href="'+esc(t.file)+'"'+a+'>'+inner+'</a>';
  }
  var h='';
  CATS.forEach(function(c){
    var items=TOOLS.filter(function(t){return t.cat===c.id}).sort(function(a,b){return(b.featured?1:0)-(a.featured?1:0)});
    h+='<section class="sec" id="sec-'+c.id+'"><div class="sec-h"><h2><span class="bar" style="background:'+c.color+'"></span>'+esc(c.full)+'</h2><p>'+esc(c.blurb)+'</p></div><div class="grid">'+items.map(function(t){return card(t,c)}).join('')+'</div></section>'});
  $('#sections').innerHTML=h;
  function apply(){
    var terms=state.q.trim().toLowerCase().split(/\s+/).filter(Boolean),shown=0;
    document.querySelectorAll('.card').forEach(function(el){
      var ok=(state.cat==='all'||el.dataset.cat===state.cat)&&terms.every(function(w){return el.dataset.text.indexOf(w)>-1});
      el.hidden=!ok;if(ok)shown++});
    document.querySelectorAll('.sec').forEach(function(s){s.hidden=!s.querySelector('.card:not([hidden])')});
    $('#empty').style.display=shown?'none':'block';
  }
  $('#q').addEventListener('input',function(e){state.q=e.target.value;apply()});
  $('#chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;state.cat=b.dataset.cat;
    document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});apply()});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
    if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';state.q='';apply();$('#q').blur()}});
  var D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function tick(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
    $('#nowTime').textContent=p(d.getHours())+':'+p(d.getMinutes());
    $('#nowDate').textContent=D[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()}
  tick();setInterval(tick,20000);
})();
</script>
</body>
</html>
